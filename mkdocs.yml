site_name: 資工所備考筆記
site_url: https://cs.hoshiyomi-dev.work

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/solid/trash
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
repo_url: https://gitlab.com/xDDoubleTea/cs-grad-notes

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.arithmatex:
      generic: true

  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - 首頁: index.md
  - 資料結構:
      - Hashing: data-structures/hashing.md
      - Tree: data-structures/trees.md
  - 演算法:
      - 圖論基礎: algorithms/graph-basics.md
  - 離散數學:
      - 生成函數: discrete-mathematics/generating-functions.md
  - 線性代數:
      - 向量空間: linear-algebra/vector-spaces.md
  - 計算機結構:
      - 效能評估: computer-architecture/performance.md
  - 作業系統:
      - 待補: operating-systems/idk.md

plugins:
  - search
