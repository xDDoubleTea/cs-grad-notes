site_name: 跨考資工所筆記
site_url: https://cs.hoshiyomi-dev.work

theme:
  name: material
  features:
    - navigation.tabs
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/solid/trash
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
repo_url: https://gitlab.com/xDDoubleTea/cs-grad-notes

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.arithmatex:
      generic: true

  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-pages
